name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '%s\n' 'The following files need gofmt:' "$files" >&2
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod tidy -diff
          go mod verify

      - name: Run tests
        run: |
          go test ./...
          go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build supported targets
        run: |
          go build ./cmd/vlt
          GOOS=linux GOARCH=amd64 go build ./cmd/vlt
          GOOS=darwin GOARCH=amd64 go build ./cmd/vlt
          GOOS=darwin GOARCH=arm64 go build ./cmd/vlt
          GOOS=windows GOARCH=amd64 go build ./cmd/vlt
